<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — The Path May Be Broken | TermiArt</title>
  <meta name="description" content="The path may be broken, but the journey isn't. Return to TermiArt creative studio.">
  <meta name="theme-color" content="#07080d">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #07080d;
      color: #f0f2f8;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Subtle Grid & Scanline */
    .bg-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 70%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 48px 48px, 48px 48px;
    }

    .crt-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      opacity: 0.35;
    }

    /* Cinematic Central Composition */
    .cinematic-container {
      position: relative;
      z-index: 10;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: cinematic-fade 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .brand-eyebrow span.accent {
      color: #00f0ff;
    }

    .error-code {
      font-family: 'Space Grotesk', 'Outfit', sans-serif;
      font-size: clamp(88px, 16vw, 160px);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.06em;
      color: #fbf8ef;
      text-shadow: 0 0 60px rgba(0, 240, 255, 0.2);
      margin-bottom: 28px;
      user-select: none;
    }

    .hairline-divider {
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      margin-bottom: 32px;
    }

    .error-message {
      font-size: clamp(18px, 2.5vw, 24px);
      font-weight: 500;
      line-height: 1.45;
      color: #cbd5e1;
      margin-bottom: 12px;
      max-width: 480px;
    }

    .error-submessage {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 40px;
      letter-spacing: 0.05em;
    }

    .btn-return {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 9999px;
      background: #fbf8ef;
      color: #08090e;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.05em;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 20px rgba(251, 248, 239, 0.2);
    }

    .btn-return:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 30px rgba(251, 248, 239, 0.35);
      background: #ffffff;
    }

    .btn-return:active {
      transform: translateY(1px);
    }

    .btn-glyph {
      font-family: 'JetBrains Mono', monospace;
      color: #00f0ff;
    }

    .terminal-footer-status {
      position: absolute;
      bottom: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .blink-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00ff66;
      box-shadow: 0 0 8px #00ff66;
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes cinematic-fade {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="crt-lines"></div>

  <main class="cinematic-container">
    <div class="brand-eyebrow">
      <span class="accent">&gt;_</span> TERMIART // STATUS 404
    </div>

    <div class="error-code">404</div>

    <div class="hairline-divider"></div>

    <h1 class="error-message">
      The path may be broken,<br>but the journey isn't.
    </h1>

    <p class="error-submessage">
      [ERR_COORDINATE_NOT_FOUND // MATRIX_STREAM_DISCONNECTED]
    </p>

    <a href="/" class="btn-return">
      <span class="btn-glyph">❯</span>
      <span>BACK TO TERMIART</span>
    </a>
  </main>

  <footer class="terminal-footer-status">
    <span class="blink-dot"></span>
    <span>CORE ENGINE ONLINE // RETURN TO CANVAS</span>
  </footer>
</body>
</html>
